<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Forged Legends">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c2"/>
      <stop offset=".35" stop-color="#f2c14e"/>
      <stop offset=".65" stop-color="#b9831f"/>
      <stop offset="1" stop-color="#f6d27a"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2833"/>
      <stop offset="1" stop-color="#121117"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset=".45" stop-color="#ea7a1a"/>
      <stop offset="1" stop-color="#f2c14e"/>
    </linearGradient>
    <linearGradient id="fireCore" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#fff0c2"/>
    </linearGradient>
    <clipPath id="hex"><polygon points="50,5 89,27.5 89,72.5 50,95 11,72.5 11,27.5"/></clipPath>
  </defs>

  <!-- badge -->
  <polygon points="50,3 91,26.5 91,73.5 50,97 9,73.5 9,26.5" fill="url(#steel)"/>

  <!-- flames rising behind the letters -->
  <g clip-path="url(#hex)">
    <path fill="url(#fire)" d="M50,90 C28,90 18,76 21,61 C23,51 30,46 29,34 C37,40 40,47 40,53
      C41,41 47,31 45,13 C58,23 64,36 61,49 C65,45 67,40 67,33 C77,43 81,56 78,67 C75,81 64,90 50,90 Z"/>
    <path fill="url(#fireCore)" opacity=".9" d="M50,86 C36,86 30,77 32,67 C33,61 37,58 37,51 C42,55 44,60 44,64
      C45,56 49,49 48,39 C56,46 60,55 57,64 C60,62 62,58 62,54 C67,61 68,69 66,75 C63,82 57,86 50,86 Z"/>
  </g>

  <!-- gold rim drawn over the flames -->
  <polygon points="50,3 91,26.5 91,73.5 50,97 9,73.5 9,26.5" fill="none" stroke="url(#gold)" stroke-width="4" stroke-linejoin="round"/>

  <!-- FL monogram with dark outline so it reads over the fire -->
  <g fill="url(#gold)" stroke="#121117" stroke-width="3" stroke-linejoin="round" paint-order="stroke">
    <polygon points="27,25 63,25 58,33 36,33 36,75 27,75"/>
    <polygon points="47,38 56,38 56,67 74,67 69,75 47,75"/>
    <polygon points="36,45 58,45 54,52 36,52"/>
  </g>

  <!-- embers -->
  <g fill="#fff0c2">
    <circle cx="72" cy="24" r="1.3"/><circle cx="78" cy="33" r="0.9"/><circle cx="25" cy="20" r="0.9"/><circle cx="20" cy="30" r="0.7"/>
  </g>
</svg>
